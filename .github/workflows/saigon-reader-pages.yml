name: Deploy Saigon Reader to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["saigon-reader/**", ".github/workflows/saigon-reader-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests and content checks
        run: npm test
        working-directory: saigon-reader
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saigon-reader
      - id: deployment
        uses: actions/deploy-pages@v4
