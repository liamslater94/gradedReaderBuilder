<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saigon Reader</title>
  <meta name="description" content="Graded stories from Saigon for learning Southern Vietnamese.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Saigon Reader">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><span class="ti">📚</span><span>Truyện</span></a>
    <a href="#/review" data-tab="review"><span class="ti">🃏</span><span>Ôn tập</span><b class="badge" id="due-badge" hidden></b></a>
    <a href="#/dialect" data-tab="dialect"><span class="ti">🌴</span><span>Nam–Bắc</span></a>
    <a href="#/me" data-tab="me"><span class="ti">🧑</span><span>Tui</span></a>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
